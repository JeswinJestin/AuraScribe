name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint_and_format:
    name: Lint, Type Check, and Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npx prettier --check .

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage

  build_rust:
    name: Build Rust Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-rust-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-rust-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-rust-build-${{ matrix.platform }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Rust test
        working-directory: ./src-tauri
        run: cargo test

      - name: Rust clippy
        working-directory: ./src-tauri
        run: cargo clippy -- -D warnings

      - name: Build Tauri
        working-directory: ./src-tauri
        run: cargo build --release

  build_frontend:
    name: Build Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: dist/

  build_linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    needs: [build_frontend, build_rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential \
            curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Download frontend artifacts
        uses: actions/download-artifact@v3
        with:
          name: frontend-build

      - name: Install all dependencies
        run: npm ci

      - name: Build Tauri app (Linux)
        working-directory: ./src-tauri
        run: |
          cargo tauri build --target x86_64-unknown-linux-gnu
          cp src-tauri/target/release/bundle/deb/aurascribe_1.0.0_amd64.deb ..

      - name: Upload Linux build
        uses: actions/upload-artifact@v3
        with:
          name: linux-build
          path: 
            deb: *.deb
            AppImage: src-tauri/target/release/bundle/appimage/*.AppImage

  build_windows:
    name: Build Windows App
    runs-on: windows-latest
    needs: [build_frontend, build_rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install all dependencies
        run: npm ci

      - name: Download frontend artifacts
        uses: actions/download-artifact@v3
        with:
          name: frontend-build

      - name: Build Tauri app (Windows)
        working-directory: ./src-tauri
        run: |
          cargo tauri build --target x86_64-pc-windows-msvc
          Copy-Item src-tauri/target/release/bundle/msi/aurascribe_1.0.0_x64_en-US.msi ..

      - name: Upload Windows build
        uses: actions/upload-artifact@v3
        with:
          name: windows-build
          path: *.msi

  build_macos:
    name: Build macOS App
    runs-on: macos-latest
    needs: [build_frontend, build_rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install all dependencies
        run: npm ci -g corepack
        corepack enable

      - name: Download frontend artifacts
        uses: actions/download-artifact@v3
        with:
          name: frontend-build

      - name: Build Tauri app (macOS)
        working-directory: ./src-tauri
        run: |
          cargo tauri build
          cp src-tauri/target/release/bundle/dmg/aurascribe_1.0.0_x64.dmg ..

      - name: Upload macOS build
        uses: actions/upload-artifact@v3
        with:
          name: macos-build
          path: *.dmg

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build_linux, build_windows, build_macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: AuraScribe v1.0.0
          draft: false
          prerelease: false
          files: |
            **/*.deb
            **/*.msi
            **/*.dmg
            **/*.AppImage
          generate_release_notes: true