name: Release

# Build native production bundles for Windows, macOS and Linux in parallel on GitHub's free
# cloud runners, and attach all of them to a single GitHub Release.
#
# Trigger: push a version tag (e.g. `git tag v1.2.0 && git push origin v1.2.0`).
# `workflow_dispatch` runs the same builds for validation WITHOUT publishing anything, so you
# can prove a change compiles + bundles on all three OSes before you cut a tag.
#
# WHY A MATRIX OF NATIVE RUNNERS (not cross-compilation): Tauri produces a platform-native
# installer per OS (`.exe` via NSIS, `.dmg`, `.deb` + `.AppImage`), whisper-rs compiles
# whisper.cpp from source for the host, and sherpa-rs downloads a prebuilt sherpa-onnx + ONNX
# Runtime for the host target. All three are far simpler and more reliable built on the real OS
# than cross-compiled — so each matrix row runs on the OS it produces.
#
# WHY TWO JOBS: `prepare-release` creates the draft release exactly once, then every `build`
# job uploads its bundle into that one release. Doing the create inside the parallel matrix
# would race and spawn duplicate draft releases.
#
# HONEST STATE (read docs/HANDOFF.md, 2026-08-18): the WINDOWS build is the proven, shipped one.
# The macOS/Linux rows build the SAME Rust — but the platform layer (text injection, the global
# hotkey's startup registration, "open settings folder", accessibility) is currently an explicit
# "not yet implemented on this platform" stub off Windows, and the sherpa/ONNX shared libs are
# not yet bundled there. So a macOS/Linux bundle installs and launches but does NOT dictate yet.
# The release is created as a DRAFT on purpose: nothing goes public until a human reviews it and
# decides how to label the experimental non-Windows assets.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Required to create the release and upload assets with the gh CLI.
permissions:
  contents: write

env:
  # Compile whisper.cpp on most-but-not-all cores; mirrors the local build scripts' politeness
  # and keeps memory in check on the runners.
  CARGO_BUILD_JOBS: '4'
  CMAKE_BUILD_PARALLEL_LEVEL: '4'
  RUST_BACKTRACE: '1'
  # linuxdeploy/appimagetool mount themselves via FUSE, which GitHub's Linux runners don't provide,
  # so AppImage bundling fails with "failed to run linuxdeploy". This makes them extract-and-run
  # instead of mounting — the standard CI workaround.
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  # -----------------------------------------------------------------------------------------
  # Create the draft release once (tag pushes only). Idempotent: reruns reuse the same release.
  # -----------------------------------------------------------------------------------------
  prepare-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — reusing it."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "AuraScribe $TAG" \
              --notes $'Draft release.\n\n**Windows (.exe)** is the proven, fully-supported build.\n\n**macOS (.dmg, Apple Silicon)** and **Linux (.deb)** are cross-platform previews: dictation logic (global hotkey, keystroke/clipboard injection) is implemented on all three OSes, and BOTH now ship their sherpa-onnx / ONNX Runtime libraries inside the bundle (macOS in Contents/Frameworks, ad-hoc signed; Linux in /usr/lib/AuraScribe with the exact libs the binary linked against, so there is no version mismatch to segfault on). macOS installation needs the Gatekeeper steps in docs/INSTALL.md (the app is not notarized). Model loading on macOS/Linux still needs on-device verification — review the assets, test, then publish.'
            echo "Created draft release $TAG."
          fi

  # -----------------------------------------------------------------------------------------
  # Build the native bundle on each OS, in parallel. Runs on workflow_dispatch too (validation),
  # in which case the upload step is skipped.
  # -----------------------------------------------------------------------------------------
  build:
    needs: prepare-release
    # Still build on workflow_dispatch, where prepare-release is skipped (no tag). Only bail if
    # prepare-release actually failed.
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    name: Build ${{ matrix.name }}
    strategy:
      # Never cancel the proven Windows build because an experimental macOS/Linux row failed —
      # we want every platform's result from one run.
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            artifact_name: aurascribe-windows-exe
            # Mirror the proven local release exactly: Moonshine feature + the Windows-only
            # overlay that bundles onnxruntime/sherpa + the MSVC runtime DLLs next to the exe.
            tauri_args: '--features moonshine --config src-tauri/tauri.moonshine.conf.json'
            artifacts: |
              src-tauri/target/release/bundle/nsis/*-setup.exe
          - name: macOS (Apple Silicon)
            os: macos-latest
            artifact_name: aurascribe-macos-dmg
            # Build ONLY the .app (not the .dmg): Tauri's dmg bundler deletes the .app right after
            # packaging it, which left no bundle for the lib-embed step to patch. We build the .app,
            # embed the sherpa dylibs + sign it, then create the .dmg ourselves in a later step.
            tauri_args: '--features moonshine --bundles app'
            artifacts: |
              src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux (x64)
            os: ubuntu-latest
            artifact_name: aurascribe-linux-deb
            # .deb only. The AppImage path relies on linuxdeploy, which needs FUSE that GitHub's
            # runners don't provide; even with APPIMAGE_EXTRACT_AND_RUN it fails to resolve the loose
            # sherpa/onnx .so libs, so it is dropped from CI until the packaging is stabilised. The
            # .deb builds reliably and installs on Debian/Ubuntu (the common desktop case).
            tauri_args: '--features moonshine --bundles deb'
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Toolchains ---------------------------------------------------------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache the cargo REGISTRY (dependency downloads) but NOT the target dir. sherpa-rs-sys copies
      # its runtime shared libs into target/release only while its build script runs, and Swatinem
      # prunes those loose libs from a cached target — so on a cache hit they exist nowhere and both
      # the Windows resource check and the macOS lib embedding break. A non-cached target means every
      # build behaves like the proven first (cold) run: the libs are always freshly emitted. Costs a
      # few extra minutes (whisper.cpp recompiles), acceptable for a tag-only release workflow.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-targets: false

      # ---- Per-OS system dependencies -----------------------------------------------------
      # Linux: WebKitGTK (webview), GTK, appindicator (tray), ALSA (cpal capture), patchelf
      # (AppImage), plus clang/libclang + cmake for whisper.cpp's bindgen build.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file \
            build-essential \
            cmake \
            clang \
            libclang-dev

      # macOS: Xcode ships clang + libclang; whisper.cpp still needs cmake.
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake

      # Windows: the runner image ships LLVM + CMake; whisper-rs's bindgen just needs libclang.
      - name: Configure libclang (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      # ---- Build --------------------------------------------------------------------------
      - name: Install npm dependencies
        run: npm ci

      # `tauri build` runs `next build` (beforeBuildCommand) for the frontend, then compiles the
      # Rust and bundles the native installer(s) for this OS.
      - name: Build the app bundle
        run: npx tauri build ${{ matrix.tauri_args }}

      # macOS: Tauri does not place the sherpa/onnxruntime dylibs inside the .app, and (with our
      # build.rs rpath = @executable_path/../Frameworks) the binary looks in Contents/Frameworks for
      # them. Embed every produced dylib there, ad-hoc codesign the bundle so Gatekeeper will launch
      # an unsigned build on Apple Silicon at all, then rebuild the .dmg (with the familiar drag-to-
      # Applications layout) from the patched .app. BEST-EFFORT — model loading needs a real-Mac test.
      - name: Embed sherpa libs, ad-hoc sign, repack dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/release/bundle/macos/AuraScribe.app"
          if [ ! -d "$app" ]; then echo "::error::no .app at $app — cannot build the dmg"; ls -R src-tauri/target/release/bundle 2>/dev/null || true; exit 1; fi
          fw="$app/Contents/Frameworks"
          mkdir -p "$fw"
          # Embed ONLY the sherpa-onnx / ONNX Runtime RUNTIME dylibs — matched by name so we never
          # sweep in Rust proc-macro plugins from deps/ (libserde_derive, libtokio_macros, …), which
          # are compiler artifacts, not runtime libs, and must not ship in a distributed app. Prune
          # the bundle dir so we don't recurse into the .app. (bash 3.2 on the runner — no assoc arrays.)
          all_libs="$(find src-tauri/target/release -path '*/bundle' -prune -o \( -name 'libonnxruntime*.dylib' -o -name 'libsherpa-onnx-*.dylib' \) -type f -print)"
          count=0
          for base in $(printf '%s\n' "$all_libs" | xargs -n1 basename 2>/dev/null | sort -u); do
            [ -z "$base" ] && continue
            src="$(printf '%s\n' "$all_libs" | grep "/$base$" | head -n1)"
            [ -z "$src" ] && continue
            cp -f "$src" "$fw/"; count=$((count+1)); echo "embedded $base  (from $src)"
          done
          echo "embedded $count dylib(s) into Contents/Frameworks"
          if [ "$count" -eq 0 ]; then echo "::error::no dylibs found to embed — the dmg would not load models"; exit 1; fi
          # Ad-hoc signature (identity "-") so an unsigned build is allowed to run on Apple Silicon.
          codesign --force --deep --sign - "$app" || echo "::warning::codesign failed (non-fatal)"
          # Rebuild the dmg from the patched, signed .app so the shipped dmg actually contains the libs.
          ver="$(node -p "require('./package.json').version")"
          out="src-tauri/target/release/bundle/dmg"
          staging="$(mktemp -d)"
          mkdir -p "$out"
          rm -f "$out"/*.dmg
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "AuraScribe" -srcfolder "$staging" -ov -format UDZO \
            "$out/AuraScribe_${ver}_aarch64.dmg"
          echo "repacked dmg:"; ls -la "$out"

      # Linux: Tauri's .deb ships the binary but NOT its private sherpa-onnx / ONNX Runtime shared
      # libraries, so it died at launch with `error while loading shared libraries:
      # libsherpa-onnx-c-api.so`. (A tester who hand-compiled their own sherpa-onnx to fill the gap
      # then hit a Segmentation fault — an ABI/version mismatch against a library this binary was
      # never linked to.) The robust fix is to ship the EXACT libs THIS build produced, so there is
      # nothing to mismatch. build.rs gives the binary a runpath of `$ORIGIN/../lib/AuraScribe`, and
      # the binary installs at /usr/bin/aurascribe, so inject those libs into /usr/lib/AuraScribe
      # inside the .deb and repack. Each lib also gets its own `$ORIGIN` rpath so libsherpa can find
      # libonnxruntime beside it (DT_RUNPATH is not transitive — the binary's runpath alone won't
      # resolve a lib's own dependencies). BEST-EFFORT from CI: the layout is verified here with
      # `ldd`, but a real model load still needs an on-device run.
      - name: Bundle sherpa/onnx libs into the .deb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' | head -n1)"
          if [ -z "$deb" ]; then echo "::error::no .deb produced"; ls -R src-tauri/target/release/bundle 2>/dev/null || true; exit 1; fi
          echo "Patching $deb"

          # The runtime .so files this build linked against. Name-matched so we never sweep in
          # unrelated build artifacts; prune the bundle dir so we don't recurse into staged copies.
          libs="$(find src-tauri/target/release -path '*/bundle' -prune -o \
                    \( -name 'libonnxruntime*.so*' -o -name 'libsherpa-onnx-*.so*' \) -type f -print)"
          if [ -z "$libs" ]; then
            echo "::error::no sherpa/onnx .so found in target/release — cannot bundle"
            find src-tauri/target -name '*.so*' 2>/dev/null | sort || true
            exit 1
          fi

          work="$(mktemp -d)"
          dpkg-deb -R "$deb" "$work"                # extract control + data, preserving depends
          libdir="$work/usr/lib/AuraScribe"          # matches build.rs rpath: $ORIGIN/../lib/AuraScribe
          mkdir -p "$libdir"

          count=0
          for base in $(printf '%s\n' "$libs" | xargs -n1 basename | sort -u); do
            src="$(printf '%s\n' "$libs" | grep "/$base$" | head -n1)"
            [ -z "$src" ] && continue
            cp -fL "$src" "$libdir/$base"
            chmod 644 "$libdir/$base"
            # Each lib resolves its siblings (e.g. sherpa -> onnxruntime) from its own directory.
            patchelf --set-rpath '$ORIGIN' "$libdir/$base" || echo "::warning::patchelf rpath failed for $base"
            count=$((count+1)); echo "bundled $base (from $src)"
          done
          echo "bundled $count .so into /usr/lib/AuraScribe"
          [ "$count" -eq 0 ] && { echo "::error::nothing bundled"; exit 1; }

          # ONNX Runtime is often NEEDED by its versioned soname; make sure both an unversioned and a
          # versioned name exist so whichever the sherpa libs reference resolves.
          ( cd "$libdir"
            for f in libonnxruntime.so.*; do
              [ -e "$f" ] || continue
              [ -e libonnxruntime.so ] || ln -s "$f" libonnxruntime.so
            done
            if [ -e libonnxruntime.so ] && ! ls libonnxruntime.so.* >/dev/null 2>&1; then
              real="$(readlink -f libonnxruntime.so || true)"; :  # unversioned only — leave as is
            fi
          )

          # VERIFY the layout resolves before repacking. $ORIGIN in the binary's runpath resolves to
          # the binary's real dir at ldd time (work/usr/bin), so ../lib/AuraScribe points at exactly
          # the libs we just placed — this actually proves the install layout, not just its presence.
          echo "== binary dynamic section =="
          readelf -d "$work/usr/bin/aurascribe" | grep -iE 'rpath|runpath|NEEDED.*(sherpa|onnx)' || true
          echo "== ldd against the bundled layout =="
          ldd "$work/usr/bin/aurascribe" || true
          if ldd "$work/usr/bin/aurascribe" 2>/dev/null | grep -iE 'sherpa|onnxruntime' | grep -qi 'not found'; then
            echo "::error::a sherpa/onnx library is still unresolved after bundling"
            ldd "$work/usr/bin/aurascribe" | grep -i 'not found' || true
            exit 1
          fi

          # Repack (xz, matching Tauri's default). Control/depends are preserved from the extract.
          # --root-owner-group forces the archived files to root:root, so the rebuilt .deb installs
          # like a normal package (a raw `dpkg-deb -R` leaves them owned by the CI user otherwise).
          dpkg-deb -Zxz --root-owner-group --build "$work" "$deb"
          echo "== repacked contents (app libs + binary) =="
          dpkg-deb -c "$deb" | grep -E 'usr/lib/AuraScribe|usr/bin/aurascribe' || true
          # Expose the .deb path to later steps.
          echo "DEB_PATH=$deb" >> "$GITHUB_ENV"

      # THE decisive test: install the .deb in a CLEAN Ubuntu container (only its declared depends
      # get pulled — exactly a fresh user's machine, NOT this dev-tool-laden runner) and confirm the
      # dynamic loader resolves EVERY library, including the bundled sherpa/onnx libs and their own
      # runtime deps (libgomp for ONNX Runtime's OpenMP, etc.). This is what catches "installs, opens,
      # then crashes on model load" before it ever reaches a user: a single `not found` fails the build.
      - name: Smoke-test the .deb on a clean machine (install + ldd)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb="${DEB_PATH}"   # relative to the workspace, e.g. src-tauri/target/release/bundle/deb/x.deb
          echo "Testing $deb in a clean ubuntu:24.04 container"
          docker run --rm -v "$PWD:/w" -e DEB="/w/$deb" ubuntu:24.04 bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            # Install the package and let apt pull its declared dependencies from the archive.
            apt-get install -y -qq "$DEB"
            echo "== installed layout =="
            ls -l /usr/bin/aurascribe /usr/lib/AuraScribe || true
            echo "== ldd /usr/bin/aurascribe (clean machine) =="
            ldd /usr/bin/aurascribe || true
            missing="$(ldd /usr/bin/aurascribe 2>/dev/null | grep -i "not found" || true)"
            # Also verify the bundled libs resolve THEIR own dependencies (transitive: sherpa -> onnx -> libgomp).
            for so in /usr/lib/AuraScribe/*.so*; do
              [ -e "$so" ] || continue
              m="$(ldd "$so" 2>/dev/null | grep -i "not found" || true)"
              [ -n "$m" ] && missing="$missing"$'\n'"($so) $m"
            done
            if [ -n "$missing" ]; then
              echo "::error::unresolved libraries on a clean machine — the app would crash at model load:"
              echo "$missing"
              exit 1
            fi
            echo "ALL LIBRARIES RESOLVE ON A CLEAN MACHINE ✔"
          '

      # Save the built bundle as a downloadable workflow artifact for EVERY run (tag or manual
      # dispatch), so a fixed .deb can be pulled straight from the run and shared with a tester
      # BEFORE any public release is cut.
      - name: Upload bundle as a shareable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: warn
          retention-days: 14

      # Show exactly what this OS produced, in the run summary — useful while macOS/Linux
      # bundling is still being dialed in.
      - name: List produced bundles
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }} — produced bundles"
            echo '```'
            find src-tauri/target -path '*/bundle/*' -type f 2>/dev/null | sort || true
            echo '```'
            echo "Shared libs (onnxruntime / sherpa) that need bundling next to the binary:"
            echo '```'
            find src-tauri/target -maxdepth 3 \( -name '*.dylib' -o -name '*.so' -o -name '*.so.*' \) 2>/dev/null | sort || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- Upload (tag pushes only) -------------------------------------------------------
      # Collect this OS's artifacts, guarantee the Linux AppImage is executable, and upload into
      # the single draft release created by prepare-release. --clobber makes reruns idempotent.
      - name: Upload bundles to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          TAG="${GITHUB_REF_NAME}"

          # Expand each glob line from the matrix into a real file list.
          files=()
          while IFS= read -r pattern; do
            pattern="$(echo "$pattern" | xargs)"   # trim whitespace
            [ -z "$pattern" ] && continue
            for f in $pattern; do
              [ -e "$f" ] && files+=("$f")
            done
          done <<< "${{ matrix.artifacts }}"

          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No bundles matched for ${{ matrix.name }} — nothing to upload."
            exit 0
          fi

          # Open-source distribution: make any AppImage executable before it ships.
          for f in "${files[@]}"; do
            case "$f" in
              *.AppImage) chmod +x "$f"; echo "chmod +x $f" ;;
            esac
          done

          printf 'Uploading:\n'; printf '  %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
