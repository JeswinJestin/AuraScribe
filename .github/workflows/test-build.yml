name: Test Build (Windows, prompt feature)

# Manual-only. Builds the Windows installer WITH the optional on-device prompt-optimizer
# (`--features moonshine,prompt`) and uploads it as a downloadable artifact, so the owner can
# test the prompt-optimization feature on a real machine before it ships.
#
# WHY THIS EXISTS SEPARATELY from release.yml: the `prompt` feature links llama.cpp, and whisper.cpp
# (always compiled) ALSO vendors ggml — so this build is where we find out whether the two ggml
# copies collide at link time on MSVC. Keeping it out of the release matrix means an experimental
# prompt build can never accidentally ship, and a link failure here does not touch the proven
# release pipeline.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '4'
  CMAKE_BUILD_PARALLEL_LEVEL: '4'
  RUST_BACKTRACE: '1'

jobs:
  windows-prompt:
    name: Windows installer (moonshine + prompt)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Same cache policy as release.yml: never cache the target dir (sherpa-rs-sys emits its runtime
      # DLLs into target/release only while its build script runs; a warm target prunes them).
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-targets: false

      - name: Configure libclang (Windows)
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      # The Moonshine overlay config lists the sherpa/onnxruntime DLLs as bundle resources at
      # target/release/*.dll. Tauri's build.rs validates those resources EXIST, but on a clean build
      # sherpa-rs-sys emits them under target/release/deps or build/*/out and cargo only copies them
      # to target/release at final-link time — AFTER build.rs runs. The longer llama.cpp compile
      # (added by `prompt`) perturbed the timing enough to expose this: `onnxruntime.dll doesn't
      # exist`. Fix: a first `cargo build` runs sherpa-rs-sys's build script (emitting the DLLs
      # somewhere under target), we copy them up to target/release, THEN Tauri's resource check +
      # bundle both find them.
      - name: Build sherpa deps + place runtime DLLs, then bundle
        shell: bash
        run: |
          set -o pipefail
          cd src-tauri
          echo "== pass 1: compile deps so sherpa-rs-sys emits its runtime DLLs (may fail at Tauri's resource check — that's fine) =="
          cargo build --release --features "moonshine,prompt" || echo "::notice::pass-1 cargo build did not fully succeed (expected — placing DLLs next)"
          echo "== locate the sherpa / onnxruntime DLLs cargo produced =="
          found="$(find target/release -maxdepth 4 \( -iname 'onnxruntime*.dll' -o -iname 'sherpa-onnx-*.dll' \) 2>/dev/null | sort -u)"
          echo "$found"
          if [ -z "$found" ]; then echo "::error::no sherpa/onnx DLLs found under target/release — sherpa-rs-sys did not emit them"; exit 1; fi
          echo "== copy them to target/release (where the bundle resource check expects them) =="
          while IFS= read -r dll; do
            [ -z "$dll" ] && continue
            base="$(basename "$dll")"
            if [ ! -e "target/release/$base" ] || [ "$dll" != "target/release/$base" ]; then
              cp -f "$dll" "target/release/$base" 2>/dev/null || true
            fi
          done <<< "$found"
          ls -la target/release/*.dll 2>/dev/null || true
          echo "== pass 2: the real bundle =="
          cd ..
          npx tauri build --features "moonshine,prompt" --config src-tauri/tauri.moonshine.conf.json

      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurascribe-windows-prompt-exe
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: warn
          retention-days: 14
