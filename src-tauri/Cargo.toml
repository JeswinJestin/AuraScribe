[package]
name = "aurascribe"
version = "1.0.0"
description = "Free, open-source, privacy-first voice dictation that works everywhere"
authors = ["AuraScribe Contributors"]
license = "MIT"
edition = "2021"
repository = "https://github.com/aurascribe/aurascribe"

[workspace]
members = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [
    "tray-icon",
    "global-shortcut",
    "notification",
    "clipboard-manager",
    "shell",
    "opener",
    "os-info",
    "updater",
    "sql",
    "store",
    "fs",
    "dialog",
    "http",
] }

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Audio
cpal = { version = "0.15", features = ["jack", "alsa", "pulse", "wasapi", "coreaudio"] }
rubato = "0.15"
ringbuf = { version = "0.3", features = ["std"] }

# VAD
silero-vad = "0.4"

# Whisper.cpp bindings
whisper-rs = { version = "0.7", features = ["cuda", "metal", "vulkan", "openblas"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate"] }
sqlcipher = { version = "0.29", features = ["bundled"] }

# Encryption
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = { version = "0.8", features = ["std"] }
zeroize = "1.7"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# System integration
windows = { version = "0.58", target = "cfg(windows)", features = [
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_System_Ole",
] }
objc = { version = "0.2", target = "cfg(target_os = \"macos\")" }
block = { version = "0.1", target = "cfg(target_os = \"macos\")" }

# Utilities
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs = "5.0"
once_cell = "1.19"
parking_lot = "0.12"

# Plugin system (future)
# wasmtime = "25"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true