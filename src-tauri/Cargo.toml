[package]
name = "aurascribe"
version = "1.0.0"
description = "Free, open-source, privacy-first voice dictation that works everywhere"
authors = ["AuraScribe Contributors"]
license = "MIT"
edition = "2021"
repository = "https://github.com/JeswinJestin/AuraScribe"

[workspace]
members = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = [
    "tray-icon",
] }

# Tauri plugins
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Audio
cpal = "0.15"
rubato = "0.15"
ringbuf = { version = "0.3", features = ["std"] }

# Whisper.cpp bindings (optional — requires libclang for bindgen)
whisper-rs = { version = "0.7", optional = true }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }

# Encryption
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = { version = "0.8", features = ["std"] }
zeroize = "1.7"
base64 = "0.22"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs = "5.0"
once_cell = "1.19"
parking_lot = "0.12"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_System_Ole",
] }
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = "0.2"
objc2-app-kit = "0.2"
core-graphics = "0.24"

[features]
default = []
whisper = ["dep:whisper-rs"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
