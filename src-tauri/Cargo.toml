[package]
name = "aurascribe"
version = "1.0.0"
description = "Free, open-source, privacy-first voice dictation that works everywhere"
authors = ["AuraScribe Contributors"]
license = "MIT"
edition = "2021"
repository = "https://github.com/JeswinJestin/AuraScribe"

[workspace]
members = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = [
    "tray-icon",
    # Image::from_bytes, used to swap the tray icon between idle/listening/processing
    "image-png",
] }

# Tauri plugins
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Audio
cpal = "0.15"

# Whisper.cpp bindings (requires libclang for bindgen).
# 0.16 bundles a modern whisper.cpp, which is what makes large-v3-turbo and the
# distil models available — accuracy near large-v3 at a fraction of the runtime.
whisper-rs = { version = "0.16", optional = true }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }

# HTTP client (model downloads only)
reqwest = { version = "0.12", features = ["rustls-tls", "stream"] }
futures-util = "0.3"

# Utilities
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs = "5.0"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = "0.2"
objc2-app-kit = "0.2"
core-graphics = "0.24"

[features]
default = ["whisper"]
whisper = ["dep:whisper-rs"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
